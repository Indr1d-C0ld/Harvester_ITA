# Harvester in italiano - configurazione DOSBox
# Avvio:  dosbox -conf dosbox-harvester-ita.conf   (dalla cartella che contiene questo file)
# I tre CD sono già copiati in HARVEST/CD1..CD3: nessun cambio di disco.
# (il lettore D: serve solo perché il gioco controlla che ce ne sia uno)
[sdl]
fullscreen=false
output=opengl
windowresolution=1280x960
autolock=true

[dosbox]
machine=svga_s3
memsize=64

[render]
aspect=true
scaler=normal2x

[cpu]
core=dynamic
cycles=max

[mixer]
rate=22050
blocksize=2048
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[gus]
gus=false

[dos]
xms=true
ems=true
umb=true
keyboardlayout=it

[autoexec]
mount c .
mount d HARVEST/CD1 -t cdrom -label DISK1
c:
cd harvest
copy CONFIG.NCD CONFIG.INI >nul
harvest
copy CONFIG.INI CONFIG.NCD >nul
exit
