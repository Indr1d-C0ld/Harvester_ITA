# Harvester in italiano - configurazione DOSBox
# Avvio:  dosbox -conf dosbox-harvester-ita.conf   (dalla cartella che contiene questo file)
# Variante fedele all'originale: i tre CD come immagini, cambio con Ctrl+F4.
# Le impostazioni di questa modalità stanno in HARVEST/CONFIG.CD.
[sdl]
fullscreen=false
output=opengl
windowresolution=1280x960
autolock=true

[dosbox]
machine=svga_s3
memsize=64

[render]
aspect=true
scaler=normal2x

[cpu]
core=dynamic
cycles=max

[mixer]
rate=22050
blocksize=2048
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[gus]
gus=false

[dos]
xms=true
ems=true
umb=true
keyboardlayout=it

[autoexec]
mount c .
imgmount d iso/DISK1.iso iso/DISK2.iso iso/DISK3.iso -t iso
c:
cd harvest
copy CONFIG.CD CONFIG.INI >nul
echo.
echo  Il gioco occupa 3 CD: quando te lo chiede, premi Ctrl+F4 per cambiare disco.
echo.
pause
harvest
copy CONFIG.INI CONFIG.CD >nul
exit
